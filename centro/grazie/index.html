<script>
document.addEventListener('DOMContentLoaded', function () {
  const MESSAGES = {
    'non-dormo-bene': 'Perfetto. Il tuo bonus arriva domani sera — nel frattempo, se non l\'hai già fatto, ascolta "Torna al Centro".',

  };
  const stato = new URLSearchParams(window.location.search).get('stato');
  const msgEl = document.getElementById('grazieMessage');
  if (stato && MESSAGES[stato]) {
    msgEl.textContent = MESSAGES[stato];
  }
